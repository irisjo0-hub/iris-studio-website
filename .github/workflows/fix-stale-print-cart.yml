name: Fix stale print cart

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Patch stale cart handling
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/PrintingProducts.jsx')
          text = path.read_text(encoding='utf-8')

          old = """        if (data && data.length > 0) {\n          setProducts(data);\n        } else {\n"""
          new = """        if (data && data.length > 0) {\n          // The database is authoritative for products. Remove stale local cart items\n          // that reference old fallback/default products or deleted catalog entries.\n          const availableProductIds = new Set(data.map(product => String(product.id)));\n          setCart(previousCart => previousCart.filter(item => availableProductIds.has(String(item.id))));\n          setProducts(data);\n        } else {\n          setCart([]);\n"""
          if old not in text:
              raise SystemExit('target block not found')
          text = text.replace(old, new, 1)

          old_error = """      } catch (e) {\n        console.error('Failed to load printing products:', e);\n        const local = localStorage.getItem('iris_printing_products');\n        if (local) {\n          const parsed = JSON.parse(local).filter(p => !p.is_hidden);\n          if (parsed.length > 0) {\n            setProducts(parsed);\n            return;\n          }\n        }\n        setProducts(DEFAULT_PRODUCTS);\n      } finally {\n"""
          new_error = """      } catch (e) {\n        console.error('Failed to load printing products:', e);\n        // Do not fall back to locally defined products: they have no authoritative\n        // database IDs and therefore cannot be submitted through the secure order RPC.\n        setCart([]);\n        setProducts([]);\n      } finally {\n"""
          if old_error not in text:
              raise SystemExit('error fallback block not found')
          text = text.replace(old_error, new_error, 1)

          path.write_text(text, encoding='utf-8')
          print('stale print cart handling patched')
          PY

      - name: Verify source
        run: |
          ! grep -n "setProducts(DEFAULT_PRODUCTS)" src/pages/PrintingProducts.jsx
          grep -n "availableProductIds" src/pages/PrintingProducts.jsx

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit patch and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/PrintingProducts.jsx .github/workflows/fix-stale-print-cart.yml
          git commit -m "fix: purge stale print cart entries" --allow-empty
          git push
          git rm .github/workflows/fix-stale-print-cart.yml
          git commit -m "chore: remove temporary print cart workflow"
          git push
