name: Apply booking calendar popup

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/calendar-popup.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace booking calendar with popup
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/Booking.jsx')
          text = path.read_text(encoding='utf-8')
          start = text.index('const CustomCalendar = ({ value, onChange, existingBookings = [], selectedPackage = null }) => {')
          end = text.index('// ─────────────────────────────────────────────\n// Main Component', start)

          replacement = r'''const CustomCalendar = ({ value, onChange, existingBookings = [], selectedPackage = null }) => {
  const [currentDate, setCurrentDate] = useState(value ? new Date(value) : new Date());
  const [isOpen, setIsOpen] = useState(false);

  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();

  const monthNames = [
    "كانون الثاني (1)", "شباط (2)", "آذار (3)", "نيسان (4)", "أيار (5)", "حزيران (6)",
    "تموز (7)", "آب (8)", "أيلول (9)", "تشرين الأول (10)", "تشرين الثاني (11)", "كانون الأول (12)"
  ];

  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const firstDayIndex = new Date(year, month, 1).getDay();

  const handlePrevMonth = () => setCurrentDate(new Date(year, month - 1, 1));
  const handleNextMonth = () => setCurrentDate(new Date(year, month + 1, 1));

  useEffect(() => {
    if (!isOpen) return undefined;
    const handleKeyDown = (event) => {
      if (event.key === 'Escape') setIsOpen(false);
    };
    document.addEventListener('keydown', handleKeyDown);
    return () => document.removeEventListener('keydown', handleKeyDown);
  }, [isOpen]);

  useEffect(() => {
    if (isOpen) {
      const previousOverflow = document.body.style.overflow;
      document.body.style.overflow = 'hidden';
      return () => { document.body.style.overflow = previousOverflow; };
    }
  }, [isOpen]);

  const days = [];
  for (let i = 0; i < firstDayIndex; i++) days.push(null);
  for (let i = 1; i <= daysInMonth; i++) days.push(new Date(year, month, i));

  const isSelected = (date) => {
    if (!date || !value) return false;
    const valDate = new Date(value);
    return date.getDate() === valDate.getDate() &&
      date.getMonth() === valDate.getMonth() &&
      date.getFullYear() === valDate.getFullYear();
  };

  const isDisabled = (date) => {
    if (!date) return true;
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    return date < today;
  };

  const getBookingStatus = (date) => {
    if (!date) return { hasBookings: false, fullyBooked: false };
    const dateStr = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    const bookingsForDate = existingBookings.filter(b =>
      b.date === dateStr &&
      (b.status === 'approved' || b.status === 'completed' || b.status === 'pending')
    );
    const hasBookings = bookingsForDate.length > 0;
    const duration = selectedPackage ? selectedPackage.duration : 50;
    const slots = generateSlots(dateStr, duration, existingBookings);
    return { hasBookings, fullyBooked: slots.length === 0 };
  };

  const handleDateClick = (date) => {
    if (!date) return;
    const { fullyBooked } = getBookingStatus(date);
    if (isDisabled(date) || fullyBooked) return;
    const formatted = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    onChange(formatted);
    setIsOpen(false);
  };

  const weekDays = ["أحد", "اثنين", "ثلاثاء", "أربعاء", "خميس", "جمعة", "سبت"];

  return (
    <>
      <button
        type="button"
        className={`calendar-trigger ${value ? 'has-value' : ''}`}
        onClick={() => setIsOpen(true)}
        aria-haspopup="dialog"
        aria-expanded={isOpen}
      >
        <span className="calendar-trigger-icon"><Calendar size={22} strokeWidth={1.7} /></span>
        <span className="calendar-trigger-copy">
          <strong>{value ? 'تاريخ الجلسة' : 'اختر تاريخ الجلسة'}</strong>
          <span>{value || 'اضغط لاختيار اليوم المناسب'}</span>
        </span>
        <span className="calendar-trigger-arrow">←</span>
      </button>

      {isOpen && (
        <div className="calendar-modal-backdrop" role="presentation" onMouseDown={(event) => {
          if (event.target === event.currentTarget) setIsOpen(false);
        }}>
          <div className="calendar-modal" role="dialog" aria-modal="true" aria-label="اختيار تاريخ الجلسة">
            <div className="calendar-modal-topbar">
              <div>
                <span className="calendar-modal-eyebrow">IRIS STUDIO</span>
                <h3>اختيار تاريخ الجلسة</h3>
              </div>
              <button type="button" className="calendar-close-btn" onClick={() => setIsOpen(false)} aria-label="إغلاق">×</button>
            </div>

            <div className="custom-calendar-box">
              <div className="cal-header">
                <button type="button" className="cal-arrow-btn" onClick={handlePrevMonth}>&lt;</button>
                <span className="cal-title">{monthNames[month]} {year}</span>
                <button type="button" className="cal-arrow-btn" onClick={handleNextMonth}>&gt;</button>
              </div>
              <div className="cal-weekdays-row">
                {weekDays.map(d => <div key={d} className="cal-wkday">{d}</div>)}
              </div>
              <div className="cal-days-grid">
                {days.map((day, idx) => {
                  if (!day) return <div key={`empty-${idx}`} className="cal-day-cell empty"></div>;
                  const disabled = isDisabled(day);
                  const { hasBookings, fullyBooked } = getBookingStatus(day);
                  const isDayDisabled = disabled || fullyBooked;
                  const selected = isSelected(day);
                  return (
                    <button
                      key={`day-${day.getDate()}`}
                      type="button"
                      className={`cal-day-cell day-btn ${selected ? 'active-day' : ''} ${disabled ? 'past-day disabled-day' : ''} ${fullyBooked ? 'fully-booked-day disabled-day' : ''} ${hasBookings ? 'has-bookings' : ''}`}
                      disabled={isDayDisabled}
                      onClick={() => handleDateClick(day)}
                    >
                      {day.getDate()}
                      {hasBookings && !fullyBooked && <span className="cal-dot"></span>}
                    </button>
                  );
                })}
              </div>
              <div className="cal-legend">
                <div className="legend-item"><span className="legend-dot selected"></span>المحدد</div>
                <div className="legend-item"><span className="legend-dot has-bookings"></span>متاح (يوجد حجوزات)</div>
                <div className="legend-item"><span className="legend-dot available"></span>متاح بالكامل</div>
                <div className="legend-item"><span className="legend-dot fully-booked"></span>محجوز بالكامل</div>
              </div>
            </div>
          </div>
        </div>
      )}
    </>
  );
};

'''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Booking.jsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: make booking calendar a popup"
          git push

      # One-shot mutation; the workflow file is removed in a follow-up cleanup.
