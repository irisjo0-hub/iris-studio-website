name: Finalize printing orders patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean duplicate patch code
        run: python scripts/fix_printing_order_patch.py

      - name: Verify source
        run: |
          grep -q "create_public_printing_order" src/pages/PrintingProducts.jsx
          grep -q "product_id: toNumericProductId" src/pages/PrintingProducts.jsx
          ! grep -q "iris_printing_orders" src/pages/PrintingProducts.jsx
          ! grep -q "iris_printing_orders" src/pages/AdminPrintingOrders.jsx
          grep -q "createSignedUrl, deleteFile" src/pages/AdminPrintingOrders.jsx
          grep -q "const rpcCartItems" src/pages/PrintingProducts.jsx

      - name: Commit final changes and remove patch helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/PrintingProducts.jsx src/pages/AdminPrintingOrders.jsx
          git rm -f .github/workflows/patch-printing-orders.yml scripts/apply_printing_orders_patch.py scripts/fix_printing_order_patch.py
          git commit -m "Secure printing order flow and admin persistence"
          git push
