name: Apply printing orders patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: python scripts/apply_printing_orders_patch.py

      - name: Verify patch
        run: |
          grep -q "create_public_printing_order" src/pages/PrintingProducts.jsx
          grep -q "product_id: toNumericProductId" src/pages/PrintingProducts.jsx
          ! grep -q "iris_printing_orders" src/pages/PrintingProducts.jsx
          ! grep -q "iris_printing_orders" src/pages/AdminPrintingOrders.jsx
          grep -q "createSignedUrl, deleteFile" src/pages/AdminPrintingOrders.jsx

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/PrintingProducts.jsx src/pages/AdminPrintingOrders.jsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Secure printing order submission and admin persistence"
          git push
