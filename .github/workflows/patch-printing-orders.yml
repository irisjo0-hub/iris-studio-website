name: Apply printing orders patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Patch printing order flows
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/pages/PrintingProducts.jsx')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              "import { supabase, uploadFile } from '../lib/supabase';",
              "import { supabase, uploadFile, deleteFile } from '../lib/supabase';"
          )
          text = text.replace("import { getNextOrderNumber } from '../lib/orderUtils';\n", "")

          start = text.index("      const generatedOrderNum = getNextOrderNumber('ORD');")
          end_marker = "      setOrderPlaced(true);\n    } catch (err) {"
          end = text.index(end_marker, start) + len("      setOrderPlaced(true);")

          new_block = r'''      const toNumericProductId = (id) => {
        const numericId = Number(id);
        return Number.isInteger(numericId) && numericId > 0 ? numericId : null;
      };

      const cartItemsStructured = selectedProduct.id === 'cart_checkout' && cart
        ? cart.map((item, idx) => ({
            id: item.id || `item-${idx}`,
            product_id: toNumericProductId(item.id),
            name: item.name,
            selectedColor: item.selectedColor || '',
            quantity: Math.max(1, Number(item.quantity) || 1),
            price: Number(item.price) || 0,
            image: item.image || ''
          }))
        : [];

      if (selectedProduct.id === 'cart_checkout') {
        const invalidCartItem = cartItemsStructured.find(item => !item.product_id);
        if (invalidCartItem) {
          throw new Error('أحد المنتجات الموجودة في السلة لم يعد متاحاً في قاعدة البيانات. أعد تحميل المنتجات وحاول مرة أخرى.');
        }
      }

      const selectedProductId = selectedProduct.id === 'cart_checkout'
        ? null
        : toNumericProductId(selectedProduct.id);

      if (selectedProduct.id !== 'cart_checkout' && !selectedProductId) {
        throw new Error('هذا المنتج غير متاح للطلب حالياً. أعد تحميل الصفحة وحاول مرة أخرى.');
      }

      let calculatedProductName = selectedProduct.name;
      if (selectedProduct.id === 'cart_checkout' && cart && cart.length > 0) {
        calculatedProductName = cart.map(item => `${item.name}${item.selectedColor ? ` [${item.selectedColor}]` : ''} (×${item.quantity})`).join(' + ');
      }

      const rpcCartItems = selectedProduct.id === 'cart_checkout'
        ? cartItemsStructured
        : [];

      const { data: rpcData, error: rpcError } = await supabase.rpc('create_public_printing_order', {
        p_order_data: {
          product_id: selectedProductId,
          product_name: calculatedProductName,
          customer_name: customerName.trim(),
          phone: phone.trim(),
          notes: finalNotes,
          image_urls: uploadedUrls,
          cart_items: rpcCartItems,
          quantity: selectedProduct.id === 'cart_checkout' ? totalCartCount : quantity,
          selected_color: selectedColor || (selectedProduct.id === 'cart_checkout' ? 'سلة متعددة' : ''),
          delivery_selected: deliverySelected,
          delivery_address: deliverySelected ? deliveryAddress.trim() : '',
          payment_method: paymentMethod
        }
      });

      if (rpcError) throw rpcError;

      const orderResult = Array.isArray(rpcData) ? rpcData[0] : rpcData;
      if (!orderResult?.order_number) {
        throw new Error('تم قبول الطلب بدون إرجاع رقم الأوردر. تواصل مع الاستوديو قبل إعادة المحاولة.');
      }

      const finalPrice = Number(orderResult.total_amount ?? 0);

      const invoiceData = {
        invoiceNo: orderResult.order_number,
        date: new Date().toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
        customerName: customerName.trim(),
        phone: phone.trim(),
        deliverySelected,
        deliveryAddress: deliveryAddress.trim(),
        paymentMethod,
        paymentStatus: paymentMethod === 'cliq' ? '📱 تم الدفع عبر CliQ' : '💵 الدفع نقداً عند الاستلام',
        cardMasked: '',
        items: selectedProduct.id === 'cart_checkout' ? [...cart] : [{
          cartItemId: selectedProduct.id,
          name: selectedProduct.name,
          selectedColor: selectedColor,
          quantity: quantity,
          price: Number(selectedProduct.price) || 0
        }],
        totalPrice: finalPrice,
        uploadedImagesCount: uploadedUrls.length,
        notes: notes.trim()
      };

      setPlacedInvoiceData(invoiceData);
      if (selectedProduct.id === 'cart_checkout') clearCart();
      setOrderPlaced(true);'''

          text = text[:start] + new_block + text[end:]
          path.write_text(text, encoding='utf-8')

          path = Path('src/pages/AdminPrintingOrders.jsx')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "import { supabase, createSignedUrl } from '../lib/supabase';",
              "import { supabase, createSignedUrl, deleteFile } from '../lib/supabase';"
          )

          start = text.index("  useEffect(() => {\n    const fetchOrders = async () => {")
          end = text.index("  const total           = orders.length;", start)

          new_admin = r'''  useEffect(() => {
    const fetchOrders = async () => {
      setLoading(true);
      try {
        const { data, error } = await supabase
          .from('printing_orders')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;
        setOrders(Array.isArray(data) ? data : []);
      } catch (err) {
        console.error('Failed to load printing orders:', err);
        setOrders([]);
        alert(`تعذر تحميل طلبات الطباعة من قاعدة البيانات: ${err.message}`);
      } finally {
        setLoading(false);
      }
    };

    fetchOrders();
  }, []);

  const handleUpdateStatus = async (id, newStatus) => {
    const { error } = await supabase
      .from('printing_orders')
      .update({ status: newStatus })
      .eq('id', id);

    if (error) {
      console.error('Failed to update printing order status:', error);
      alert(`تعذر تحديث حالة الطلب: ${error.message}`);
      return;
    }

    setOrders(prevOrders => prevOrders.map(order => (
      order.id === id ? { ...order, status: newStatus } : order
    )));
  };

  const handleUpdateItemStatus = async (orderId, itemId, newSubStatus) => {
    const order = orders.find(ord => ord.id === orderId);
    if (!order) return;

    const existingStatuses = order.item_statuses && typeof order.item_statuses === 'object'
      ? order.item_statuses
      : {};
    const updatedItemStatuses = {
      ...existingStatuses,
      [itemId]: newSubStatus
    };

    const items = getStructuredOrderItems({ ...order, item_statuses: updatedItemStatuses });
    const allReady = items.length > 0 && items.every(item => updatedItemStatuses[item.id] === 'ready');
    const anyInProgress = items.some(item => updatedItemStatuses[item.id] === 'in_progress' || updatedItemStatuses[item.id] === 'ready');

    let overallStatus = order.status;
    if (allReady && order.status !== 'completed') {
      overallStatus = 'ready';
    } else if (anyInProgress && order.status === 'pending') {
      overallStatus = 'approved';
    }

    const { error } = await supabase
      .from('printing_orders')
      .update({ item_statuses: updatedItemStatuses, status: overallStatus })
      .eq('id', orderId);

    if (error) {
      console.error('Failed to update printing order item status:', error);
      alert(`تعذر تحديث حالة المنتج: ${error.message}`);
      return;
    }

    setOrders(prevOrders => prevOrders.map(currentOrder => (
      currentOrder.id === orderId
        ? { ...currentOrder, item_statuses: updatedItemStatuses, status: overallStatus }
        : currentOrder
    )));
  };

  const parseStoragePaths = (value) => {
    if (Array.isArray(value)) return value.filter(Boolean);
    if (typeof value === 'string') {
      try {
        const parsed = JSON.parse(value);
        return Array.isArray(parsed) ? parsed.filter(Boolean) : (value ? [value] : []);
      } catch {
        return value ? [value] : [];
      }
    }
    return [];
  };

  const handleDeleteOrder = async (id) => {
    if (!window.confirm('هل أنت محدد ترغب بحذف هذا الأوردر نهائياً؟ لا يمكن التراجع عن هذا الإجراء.')) {
      return;
    }

    const order = orders.find(currentOrder => currentOrder.id === id);
    if (!order) return;

    const imagePaths = parseStoragePaths(order.image_urls);
    const { error } = await supabase
      .from('printing_orders')
      .delete()
      .eq('id', id);

    if (error) {
      console.error('Failed to delete printing order:', error);
      alert(`تعذر حذف الطلب: ${error.message}`);
      return;
    }

    setOrders(prevOrders => prevOrders.filter(currentOrder => currentOrder.id !== id));

    const cleanupResults = await Promise.allSettled(
      imagePaths.map(path => deleteFile('graduation-orders', path))
    );
    const failedCleanup = cleanupResults.filter(result => result.status === 'rejected');
    if (failedCleanup.length > 0) {
      console.warn(`Deleted order ${id}, but ${failedCleanup.length} storage file(s) could not be cleaned up.`);
    }
  };

'''
          text = text[:start] + new_admin + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify changes
        run: |
          grep -q "create_public_printing_order" src/pages/PrintingProducts.jsx
          grep -q "product_id: toNumericProductId" src/pages/PrintingProducts.jsx
          ! grep -q "iris_printing_orders" src/pages/PrintingProducts.jsx
          ! grep -q "iris_printing_orders" src/pages/AdminPrintingOrders.jsx
          grep -q "createSignedUrl, deleteFile" src/pages/AdminPrintingOrders.jsx

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/PrintingProducts.jsx src/pages/AdminPrintingOrders.jsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Secure printing order submission and admin persistence"
          git push
