name: Fix printing catalog fallback 2
on:
  push:
    branches: [main]
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/PrintingProducts.jsx')
          s = p.read_text(encoding='utf-8')
          old = """        } else {
          setCart([]);
          const local = localStorage.getItem('iris_printing_products');
          if (local) {
            const parsed = JSON.parse(local).filter(p => !p.is_hidden);
            if (parsed.length > 0) {
              setProducts(parsed);
              return;
            }
          }
          setProducts(DEFAULT_PRODUCTS);
        }
"""
          new = """        } else {
          // The live database is the only source of truth for orderable printing products.
          setCart([]);
          setProducts([]);
        }
"""
          if old not in s:
              raise SystemExit('fallback block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          print('fallback removed')
          PY
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('src/pages/PrintingProducts.jsx').read_text(encoding='utf-8')
          assert "localStorage.getItem('iris_printing_products')" not in s.split('const openOrderModal', 1)[0]
          assert 'setProducts(DEFAULT_PRODUCTS)' not in s
          print('verification passed')
          PY
      - name: Build
        run: npm ci && npm run build
      - name: Commit and remove workflow helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/PrintingProducts.jsx
          git rm .github/workflows/fix-printing-catalog-fallback-2.yml
          git commit -m "fix: stop printing catalog fallback" || exit 0
          git push