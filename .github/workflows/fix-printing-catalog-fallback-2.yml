name: Fix printing catalog fallback 2
on:
  push:
    branches: [main]
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove default printing catalog
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/pages/PrintingProducts.jsx')
          s = p.read_text(encoding='utf-8')
          s, removed = re.subn(r"const DEFAULT_PRODUCTS = \[.*?\];\n\nconst ProductStoreCard", "const ProductStoreCard", s, count=1, flags=re.S)
          if removed != 1:
              raise SystemExit(f'Expected DEFAULT_PRODUCTS block once, found {removed}')
          s = re.sub(
              r"        \} else \{\n          setCart\(\[\]\);\n          const local = localStorage\.getItem\('iris_printing_products'\);\n          if \(local\) \{\n            const parsed = JSON\.parse\(local\)\.filter\(p => !p\.is_hidden\);\n            if \(parsed\.length > 0\) \{\n              setProducts\(parsed\);\n              return;\n            \}\n          \}\n          setProducts\(DEFAULT_PRODUCTS\);\n        \}",
              "        } else {\n          // The live database is the only source of truth for orderable printing products.\n          setCart([]);\n          setProducts([]);\n        }",
              s,
              count=1
          )
          if 'DEFAULT_PRODUCTS' in s:
              raise SystemExit('DEFAULT_PRODUCTS reference remains')
          p.write_text(s, encoding='utf-8')
          print('Default printing products removed')
          PY
      - name: Verify
        run: |
          grep -n "DEFAULT_PRODUCTS" src/pages/PrintingProducts.jsx && exit 1 || true
          python - <<'PY'
          from pathlib import Path
          s = Path('src/pages/PrintingProducts.jsx').read_text(encoding='utf-8')
          assert 'DEFAULT_PRODUCTS' not in s
          assert "localStorage.getItem('iris_printing_products')" not in s.split('const openOrderModal', 1)[0]
          print('Verification passed')
          PY
      - name: Build
        run: npm ci && npm run build
      - name: Commit and remove workflow helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/PrintingProducts.jsx
          git rm .github/workflows/fix-printing-catalog-fallback-2.yml
          git commit -m "fix: remove default printing products" || exit 0
          git push