name: Verify and finalize printing orders

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Finalize source
        run: python scripts/finalize_printing_orders.py

      - name: Static verification
        run: |
          ! grep -q "getNextOrderNumber" src/pages/PrintingProducts.jsx
          ! grep -q "iris_printing_orders" src/pages/PrintingProducts.jsx
          ! grep -q "iris_printing_orders" src/pages/AdminPrintingOrders.jsx
          grep -q "create_public_printing_order" src/pages/PrintingProducts.jsx
          grep -q "product_id: toNumericProductId" src/pages/PrintingProducts.jsx
          test "$(grep -c "const cartItemsStructured =" src/pages/PrintingProducts.jsx)" -eq 1
          test "$(grep -c "const toNumericProductId =" src/pages/PrintingProducts.jsx)" -eq 1

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit and clean helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/PrintingProducts.jsx src/pages/AdminPrintingOrders.jsx
          git rm -f .github/workflows/finalize-printing-orders.yml scripts/finalize_printing_orders.py
          git commit -m "Secure printing order flow"
          git push
