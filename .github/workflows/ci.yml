name: CI

on:
  push:
    branches: [main, audit/security-performance-fixes]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: audit/security-performance-fixes
          fetch-depth: 0

      - name: Apply one-time hardening and persist it
        if: github.ref == 'refs/heads/audit/security-performance-fixes' && github.event_name == 'push'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          changed = False

          booking = Path('src/pages/Booking.jsx')
          s = booking.read_text(encoding='utf-8')
          if '// __IRIS_BOOKING_HARDENING_APPLIED__' not in s:
            original = s
            s = s.replace(
                "duration: p.features && p.features.includes('25 دقيقة') ? 25 : 50,\n            label: p.features && p.features.includes('25 دقيقة') ? '25 دقيقة' : '50 دقيقة'",
                "duration: Number.isFinite(Number(p.duration)) && Number(p.duration) > 0 ? Number(p.duration) : (p.features && p.features.includes('25 دقيقة') ? 25 : 50),\n            label: Number.isFinite(Number(p.duration)) && Number(p.duration) > 0 ? `${Number(p.duration)} دقيقة` : (p.features && p.features.includes('25 دقيقة') ? '25 دقيقة' : '50 دقيقة')"
            )
            s = s.replace(
                "  // Calculations\n  const extraCompanions = Math.max(0, companions - FREE_COMPANIONS);\n  const extraCompanionsCost = extraCompanions * EXTRA_COMPANION_PRICE;\n  const extrasTotal = extras.reduce((sum, e) => sum + e.price * e.qty, 0);\n  const packagePrice = selectedPackage ? selectedPackage.price : 0;\n  const deliveryCost = deliverySelected ? 2 : 0;\n  const subtotal = packagePrice + extraCompanionsCost + extrasTotal + deliveryCost;",
                "  // Calculations — mirror the public booking configuration from Supabase settings.\n  const companionConfig = settings?.booking_companion_config || {};\n  const freeCompanionCount = Number.isFinite(Number(companionConfig.free_companions)) ? Math.max(0, Number(companionConfig.free_companions)) : FREE_COMPANIONS;\n  const extraCompanionPrice = Number.isFinite(Number(companionConfig.extra_companion_price)) ? Math.max(0, Number(companionConfig.extra_companion_price)) : EXTRA_COMPANION_PRICE;\n  const deliveryConfig = settings?.booking_delivery_config || {};\n  const configuredDeliveryCost = Number.isFinite(Number(deliveryConfig.cost)) ? Math.max(0, Number(deliveryConfig.cost)) : 2;\n  const deliveryEnabled = deliveryConfig.enabled !== false;\n  const effectiveDeliverySelected = deliverySelected && deliveryEnabled;\n  const extraCompanions = Math.max(0, companions - freeCompanionCount);\n  const extraCompanionsCost = extraCompanions * extraCompanionPrice;\n  const extrasTotal = extras.reduce((sum, e) => sum + Number(e.price || 0) * e.qty, 0);\n  const packagePrice = selectedPackage ? Number(selectedPackage.price || 0) : 0;\n  const deliveryCost = effectiveDeliverySelected ? configuredDeliveryCost : 0;\n  const subtotal = packagePrice + extraCompanionsCost + extrasTotal + deliveryCost;"
            )
            s = s.replace(
                "    if (deliverySelected && !deliveryAddress.trim()) {\n      alert('الرجاء إدخال عنوان التوصيل بالتفصيل');\n      return;\n    }",
                "    if (deliverySelected && !deliveryEnabled) {\n      alert('خدمة التوصيل غير متاحة حالياً.');\n      setDeliverySelected(false);\n      return;\n    }\n    if (deliverySelected && !deliveryAddress.trim()) {\n      alert('الرجاء إدخال عنوان التوصيل بالتفصيل');\n      return;\n    }\n    if (deliverySelected && deliveryAddress.trim().length > 500) {\n      alert('عنوان التوصيل طويل جداً. الحد الأقصى 500 حرف.');\n      return;\n    }"
            )
            s = s.replace(
                "      let finalNotes = notes;\n      if (deliverySelected) {",
                "      let finalNotes = notes.slice(0, 5000);\n      if (effectiveDeliverySelected) {"
            )
            s = s.replace("العنوان: ${deliveryAddress}", "العنوان: ${deliveryAddress.trim().slice(0, 500)}")
            if s != original:
              booking.write_text('// __IRIS_BOOKING_HARDENING_APPLIED__\n' + s, encoding='utf-8')
              changed = True

          reels = Path('src/components/premium/IrisReelsViewer.jsx')
          s = reels.read_text(encoding='utf-8')
          if '// __IRIS_REELS_HARDENING_APPLIED__' not in s:
            original = s
            s = s.replace(
                "import { getFlowItems, getFlowItemsAsync, getApprovedFeedbackForFlow, getAllApprovedFeedback, submitFlowFeedback } from '../../repositories/flowRepository';",
                "import { getFlowItems, getFlowItemsAsync, getAllApprovedFeedbackAsync, submitFlowFeedback } from '../../repositories/flowRepository';"
            )
            s = s.replace(
                "      video.playsInline = true;\n      try {\n        video.load();\n      } catch (e) {}\n      const promise = video.play();",
                "      video.playsInline = true;\n      const promise = video.play();"
            )
            s = s.replace(
                "    setAllFeedbackList(getAllApprovedFeedback());",
                "    getAllApprovedFeedbackAsync().then(setAllFeedbackList).catch(() => {});"
            )
            s = s.replace(
                "  const refreshFeedback = () => {\n    setAllFeedbackList(getAllApprovedFeedback());\n  };",
                "  const refreshFeedback = async () => {\n    try {\n      const feedback = await getAllApprovedFeedbackAsync();\n      setAllFeedbackList(feedback);\n    } catch (err) {\n      console.warn('Could not refresh visitor feedback:', err);\n    }\n  };"
            )
            s = s.replace("    refreshFeedback();\n    setFeedbackOpen", "    void refreshFeedback();\n    setFeedbackOpen")
            s = s.replace("  const handleFeedbackSubmit = (e) => {", "  const handleFeedbackSubmit = async (e) => {")
            s = s.replace(
                "      submitFlowFeedback(items[activeIndex].id, feedbackInput, feedbackName);\n      setFeedbackInput('');\n      setFeedbackName('');\n      setFeedbackSubmitted(true);",
                "      try {\n        await submitFlowFeedback(items[activeIndex].id, feedbackInput, feedbackName);\n      } catch (err) {\n        console.error('Failed to submit visitor feedback:', err);\n        setToastMessage(isRtl ? 'تعذر إرسال التقييم، حاول مرة أخرى.' : 'Could not submit your feedback. Please try again.');\n        return;\n      }\n      setFeedbackInput('');\n      setFeedbackName('');\n      setFeedbackSubmitted(true);"
            )
            s = s.replace(
                "      if (currIndex < 7) {\n        navigateToIndex(currIndex + 1, 1);\n      } else if (currIndex === 7 && !cooldownRef.current) {",
                "      const maxIndex = items.length - 1;\n      if (currIndex < maxIndex) {\n        navigateToIndex(currIndex + 1, 1);\n      } else if (currIndex === maxIndex && !cooldownRef.current) {"
            )
            if s != original:
              reels.write_text('// __IRIS_REELS_HARDENING_APPLIED__\n' + s, encoding='utf-8')
              changed = True
          print(f'changed={changed}')
          PY

      - name: Persist hardening changes
        if: github.ref == 'refs/heads/audit/security-performance-fixes' && github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Booking.jsx src/components/premium/IrisReelsViewer.jsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: persist booking and reels hardening"
          git push origin HEAD:audit/security-performance-fixes

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
